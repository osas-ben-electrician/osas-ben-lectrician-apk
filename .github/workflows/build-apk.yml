name: Build OSAS BEN TRACKER APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Verify and prepare named APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OSAS-BEN-TRACKER-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSAS-BEN-TRACKER-debug-apk
          path: app/build/outputs/apk/debug/OSAS-BEN-TRACKER-debug.apk
          retention-days: 30

      - name: Publish GitHub Release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OSAS BEN TRACKER v1.0 (Debug APK)"
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Installable Android Debug APK for **OSAS BEN TRACKER** (`com.aistudio.osasbentracker.obtkzr`).

            ### Direct Download & Install on Android
            1. Under **Assets** below, tap **`OSAS-BEN-TRACKER-debug.apk`** to download it directly to your Android phone.
            2. Open the downloaded `.apk` file from your browser notification or **Files / Downloads** app.
            3. If Android asks, tap **Settings** and turn on **Allow from this source**, then tap **Install**.
          files: |
            app/build/outputs/apk/debug/OSAS-BEN-TRACKER-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
